[project]
name = "obtainium-mirror"
version = "0.1.0"
description = "Automated APK mirror for Obtainium"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32,<3",
  "PyYAML>=6,<7",
  "androguard>=4.1,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
