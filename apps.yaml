# Apps mirrored by this repository.
#
# Each entry is pulled from its official upstream release source. No APK is
# rebuilt or re-signed: the bytes published here are the upstream bytes.
#
# source: github | forgejo | direct
#   github   -> repo: "owner/name", asset: regex for the release asset
#   forgejo  -> base_url + repo: "owner/name", asset: regex
#   direct   -> url: direct APK URL (checked with ETag/Last-Modified)
#
# asset is a regular expression matched against the release asset filename.
# fallback_releases controls how many older releases to scan when the newest
# release does not contain a matching asset (default 10).
# package overrides the expected Android package name (defaults to id).
# archive/inner_asset support releases that ship APKs inside a zip.

defaults:
  fallback_releases: 10
  include_prereleases: false

apps:
  - id: dev.imranr.obtainium
    name: Obtainium
    author: ImranR98
    source: github
    repo: ImranR98/Obtainium
    asset: '^app-arm64-v8a-release\.apk$'
    homepage: https://github.com/ImranR98/Obtainium

