name: Sync APK mirror

on:
  schedule:
    # Every 6 hours, offset from the top of the hour.
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      app:
        description: "Only sync this package id (optional)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - apps.yaml
      - scripts/**
      - .github/workflows/sync.yml
      - requirements.txt

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apk-mirror-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Check upstream and publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync upstream APKs
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MIRROR_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          ONLY_APP: ${{ inputs.app }}
        run: |
          if [ -n "$ONLY_APP" ]; then
            python scripts/sync.py --only "$ONLY_APP"
          else
            python scripts/sync.py
          fi

      - name: Commit generated files
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json obtainium_export.json README.md site
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated changes to commit"
          else
            git commit -m "sync: refresh mirrored APKs [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        if: always()
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        if: always()
        uses: actions/deploy-pages@v4

      - name: Fail if any app failed
        if: steps.sync.outcome == 'failure'
        run: |
          echo "One or more apps failed to sync; see the log above."
          exit 1
